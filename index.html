<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Marker">
  <meta name="description" content="A running tab between two friends.">
  <title>Marker</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <span class="wordmark">Marker</span>
        <span class="brand-sub" id="subtitle"></span>
      </div>
      <button class="icon-btn" id="openSettings" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
      </button>
    </header>

    <!-- Balance: who's up, and by how much -->
    <section class="card table" aria-live="polite">
      <div class="seats">
        <div class="seat" data-seat="a">
          <span class="monogram"></span>
          <span class="seat-name"></span>
        </div>
        <div class="rail" aria-hidden="true">
          <span class="rail-line"></span>
          <span class="rail-mid"></span>
          <span class="puck" id="puck"></span>
        </div>
        <div class="seat" data-seat="b">
          <span class="monogram"></span>
          <span class="seat-name"></span>
        </div>
      </div>
      <p class="verdict" id="verdict"></p>
      <p class="figure" id="figure">$0</p>
      <button class="pill-btn" id="settleBtn" type="button">Settle up</button>
    </section>

    <!-- New entry -->
    <form class="card composer" id="composer" autocomplete="off" novalidate>
      <div class="segment" id="segment" data-kind="debt" role="tablist" aria-label="Entry type">
        <span class="segment-thumb" aria-hidden="true"></span>
        <button type="button" role="tab" data-kind="debt">Owes</button>
        <button type="button" role="tab" data-kind="payout">Paid back</button>
      </div>

      <div class="sentence">
        <button type="button" class="who" id="fromBtn"></button>
        <span class="verb" id="verb">owes</span>
        <button type="button" class="who" id="toBtn"></button>
        <button type="button" class="icon-btn swap" id="swapBtn" aria-label="Swap direction">
          <svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path d="M5 9h13l-3.5-3.5M19 15H6l3.5 3.5"/></svg>
        </button>
      </div>

      <label class="amount">
        <span class="currency">$</span>
        <input id="amount" inputmode="decimal" placeholder="0" aria-label="Amount" enterkeyhint="done">
      </label>

      <div class="bumps" id="bumps">
        <button type="button" data-add="5">+5</button>
        <button type="button" data-add="10">+10</button>
        <button type="button" data-add="20">+20</button>
        <button type="button" data-add="50">+50</button>
        <button type="button" data-add="100">+100</button>
      </div>

      <div class="chips" id="tags" role="group" aria-label="Tag"></div>
      <div class="methods" id="methods" role="radiogroup" aria-label="Payment method" hidden></div>

      <input class="note" id="note" maxlength="80" placeholder="Add a note (optional)" aria-label="Note">

      <button class="primary" id="submitBtn" type="submit" disabled>Enter an amount</button>
    </form>

    <!-- History -->
    <section class="history">
      <div class="history-head">
        <h2>History</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="filters" id="filters"></div>
      <p class="filter-summary" id="filterSummary" hidden></p>
      <div class="ledger" id="ledger"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-text"></span>
    <button type="button" class="toast-action">Undo</button>
  </div>

  <!-- Settings -->
  <dialog id="settings" class="sheet">
    <form method="dialog" class="sheet-body">
      <header class="sheet-head">
        <h3>Settings</h3>
        <button class="icon-btn" value="close" aria-label="Close">
          <svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="field-pair">
        <label class="field"><span>Name</span><input id="nameA" maxlength="20" type="text"></label>
        <label class="field"><span>Name</span><input id="nameB" maxlength="20" type="text"></label>
      </div>
      <div class="group">
        <h4>Sync</h4>
        <p class="sync-status" id="syncStatus"></p>
        <label class="field"><span>GitHub token</span><input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…"></label>
        <p class="hint">Needed once per phone to save changes. Create a <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a> for <b>markg-05/debt-tracker</b> with <b>Contents: Read and write</b>. It stays on this device.</p>
        <div class="list">
          <button type="button" id="syncBtn">
            <svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1L19.5 9M19.5 4.5V9H15M19.5 12a7.5 7.5 0 0 1-13 5.1L4.5 15M4.5 19.5V15H9"/></svg>
            <span>Sync now</span>
          </button>
          <button type="button" id="exportBtn">
            <svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>
            <span>Export backup</span>
          </button>
          <button type="button" id="importBtn">
            <svg viewBox="0 0 24 24" class="i" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19h14"/></svg>
            <span>Import backup</span>
          </button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <button type="button" class="danger-btn" id="wipeBtn">Clear everything</button>
    </form>
  </dialog>

  <!-- Entry detail -->
  <dialog id="entry" class="sheet">
    <form method="dialog" class="sheet-body" id="entryBody"></form>
  </dialog>

  <!-- Confirm -->
  <dialog id="confirm" class="sheet">
    <form method="dialog" class="sheet-body">
      <h3 id="confirmTitle"></h3>
      <p class="hint" id="confirmBody"></p>
      <div class="actions">
        <button class="secondary" value="cancel">Cancel</button>
        <button class="primary" value="ok" id="confirmOk">OK</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
